<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>工作台</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <script src="/vision/static/echarts.min.js"></script>
    <style>
        body {
            padding: 15px;
            background-color: #f5f5f5;
        }

        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #009688;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            margin-top: 5px;
        }

        .chart-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 4px solid #009688;
            padding-left: 12px;
        }

        .chart-container {
            height: 300px;
        }
    </style>
</head>

<body>

    <div class="layui-row layui-col-space15">
        <div class="layui-col-md3">
            <div class="stat-card">
                <div class="stat-value" id="patientCount">0</div>
                <div class="stat-label">患者总数</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="stat-card">
                <div class="stat-value" id="todayOptometry">0</div>
                <div class="stat-label">今日验光</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="stat-card">
                <div class="stat-value" id="pendingProcess">0</div>
                <div class="stat-label">待处理加工</div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="stat-card">
                <div class="stat-value" id="todayFollowUp">0</div>
                <div class="stat-label">今日待随访</div>
            </div>
        </div>
    </div>

    <div class="layui-row layui-col-space15">
        <div class="layui-col-md8">
            <div class="chart-card">
                <div class="chart-title">近一周验光趋势</div>
                <div id="weekChart" class="chart-container"></div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="chart-card">
                <div class="chart-title">今日随访提醒</div>
                <div id="reminderList" style="max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['jquery', 'layer'], function () {
            var $ = layui.$;

            // 加载仪表盘数据
            $.get('/vision/api/analysis/dashboard', function (res) {
                if (res.code === 0) {
                    var data = res.data;
                    $('#patientCount').text(data.patientCount || 0);
                    $('#todayOptometry').text(data.todayOptometry || 0);
                    $('#pendingProcess').text(data.pendingProcess || 0);
                    $('#todayFollowUp').text(data.todayFollowUp || 0);

                    // 渲染图表
                    var chart = echarts.init(document.getElementById('weekChart'));
                    chart.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: {
                            type: 'category',
                            data: data.weekDates || []
                        },
                        yAxis: { type: 'value', minInterval: 1 },
                        series: [{
                            data: data.weekCounts || [],
                            type: 'line',
                            smooth: true,
                            lineStyle: { color: '#009688', width: 3 },
                            areaStyle: { color: 'rgba(0,150,136,0.15)' }
                        }]
                    });
                }
            });

            // 加载待随访列表
            $.get('/vision/api/followup/pending', function (res) {
                if (res.code === 0 && res.data) {
                    var html = '';
                    var count = 0;
                    res.data.forEach(function (item) {
                        if (count < 5) {
                            html += '<div style="padding:10px; border-bottom:1px solid #eee;">';
                            html += '<div><strong>' + item.patientName + '</strong> ' + (item.patientPhone || '') + '</div>';
                            html += '<div style="color:#999; font-size:12px;">' + (item.content || '') + '</div>';
                            html += '</div>';
                            count++;
                        }
                    });
                    $('#reminderList').html(html || '<div style="color:#999; text-align:center; padding:20px;">暂无待随访</div>');
                }
            });
        });
        /*]]>*/
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>随访管理</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 15px;
            background-color: #f5f5f5;
        }

        .search-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="search-box">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md3">
                <input type="text" id="keyword" placeholder="患者姓名" class="layui-input">
            </div>
            <div class="layui-col-md2">
                <select id="statusSelect">
                    <option value="">全部状态</option>
                    <option value="PENDING">待随访</option>
                    <option value="COMPLETED">已完成</option>
                    <option value="MISSED">已逾期</option>
                </select>
            </div>
            <div class="layui-col-md2">
                <button class="layui-btn layui-btn-primary" onclick="search()">搜索</button>
                <button class="layui-btn layui-btn-primary" onclick="reset()">重置</button>
            </div>
            <div class="layui-col-md5" style="text-align: right;">
                <span class="layui-badge layui-bg-orange" style="padding: 8px 15px;">
                    今日待随访: <span id="todayCount">0</span>
                </span>
            </div>
        </div>
    </div>

    <table id="followupTable" lay-filter="followupTable"></table>

    <script type="text/html" id="toolbar">
    {{# if(d.status === 'PENDING'){ }}
        <a class="layui-btn layui-btn-xs" lay-event="complete" style="background-color:#5FB878;">完成随访</a>
        <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="cancel">取消</a>
    {{# } }}
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="view">查看</a>
</script>

    <script type="text/html" id="statusTpl">
    {{# var statusMap = {
        'PENDING': '<span class="layui-badge layui-bg-blue">待随访</span>',
        'COMPLETED': '<span class="layui-badge layui-bg-green">已完成</span>',
        'MISSED': '<span class="layui-badge layui-bg-red">已逾期</span>',
        'CANCELLED': '<span class="layui-badge layui-bg-gray">已取消</span>'
    }; }}
    {{# return statusMap[d.status] || d.status; }}
</script>

    <script type="text/html" id="typeTpl">
    {{# var typeMap = {
        'ONE_WEEK': '一周随访',
        'ONE_MONTH': '一月随访',
        'THREE_MONTHS': '三月随访',
        'SIX_MONTHS': '六月随访',
        'ONE_YEAR': '一年随访',
        'CUSTOM': '自定义'
    }; }}
    {{# return typeMap[d.followType] || d.followType; }}
</script>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['table', 'form', 'layer'], function () {
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.$;

            form.render('select');

            $.get('/vision/api/followup/today/count', function (res) {
                if (res.code === 0) $('#todayCount').text(res.data.today || 0);
            });

            var tableIns = table.render({
                elem: '#followupTable',
                url: '/vision/api/followup/page',
                page: true,
                cols: [[
                    { type: 'numbers', title: '序号', width: 60 },
                    { field: 'patientName', title: '患者', width: 100 },
                    { field: 'patientPhone', title: '联系电话', width: 130 },
                    { field: 'planDate', title: '计划日期', width: 120 },
                    { field: 'followType', title: '随访类型', width: 100, templet: '#typeTpl' },
                    { field: 'content', title: '随访内容', minWidth: 200 },
                    { field: 'status', title: '状态', width: 80, templet: '#statusTpl' },
                    { field: 'reminderCount', title: '提醒次数', width: 80 },
                    { field: 'completeDate', title: '完成时间', width: 160 },
                    { title: '操作', toolbar: '#toolbar', width: 150, fixed: 'right' }
                ]]
            });

            window.search = function () {
                tableIns.reload({
                    where: { keyword: $('#keyword').val(), status: $('#statusSelect').val() },
                    page: { curr: 1 }
                });
            };

            window.reset = function () {
                $('#keyword').val('');
                $('#statusSelect').val('');
                form.render('select');
                search();
            };

            table.on('tool(followupTable)', function (obj) {
                var data = obj.data;
                if (obj.event === 'view') {
                    layer.open({
                        type: 1,
                        title: '随访详情',
                        area: ['500px', '350px'],
                        content: '<div style="padding:20px;">' +
                            '<p><strong>患者：</strong>' + data.patientName + '</p>' +
                            '<p><strong>计划日期：</strong>' + data.planDate + '</p>' +
                            '<p><strong>随访内容：</strong>' + data.content + '</p>' +
                            '<p><strong>随访结果：</strong>' + (data.followResult || '暂无') + '</p>' +
                            '</div>'
                    });
                } else if (obj.event === 'complete') {
                    layer.prompt({ title: '填写随访结果', formType: 2 }, function (text, index) {
                        $.ajax({
                            url: '/vision/api/followup/complete/' + data.id,
                            type: 'PUT',
                            contentType: 'application/json',
                            data: JSON.stringify({ followResult: text }),
                            success: function (res) {
                                if (res.code === 0) {
                                    layer.msg('随访完成');
                                    layer.close(index);
                                    tableIns.reload();
                                } else { layer.msg(res.msg); }
                            }
                        });
                    });
                } else if (obj.event === 'cancel') {
                    layer.confirm('确定取消该随访计划吗？', function (index) {
                        $.ajax({
                            url: '/vision/api/followup/cancel/' + data.id,
                            type: 'PUT',
                            success: function (res) {
                                if (res.code === 0) {
                                    layer.msg('已取消');
                                    tableIns.reload();
                                } else { layer.msg(res.msg); }
                            }
                        });
                        layer.close(index);
                    });
                }
            });
        });
        /*]]>*/
    </script>
</body>

</html>

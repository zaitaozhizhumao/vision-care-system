<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>视光管理系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        .layui-layout-admin .layui-header {
            background: linear-gradient(135deg, #009688 0%, #4DB6AC 100%);
        }

        .layui-layout-admin .layui-logo {
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }

        .layui-nav .layui-nav-item a {
            color: #fff;
        }

        .layui-side {
            background-color: #393D49;
        }

        .layui-body {
            background-color: #f5f5f5;
        }

        .user-info {
            color: #fff;
            margin-right: 15px;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 5px;
        }

        .role-ADMIN {
            background: #f44336;
            color: #fff;
        }

        .role-OPTOMETRIST {
            background: #2196F3;
            color: #fff;
        }

        .role-DOCTOR {
            background: #4CAF50;
            color: #fff;
        }

        .role-PROCESSOR {
            background: #FF9800;
            color: #fff;
        }

        /* 只修改顶部右侧下拉菜单的字体颜色为黑色 */
        .layui-layout-right .layui-nav-child dd a {
            color: #333 !important;
        }
    </style>
</head>

<body class="layui-layout-body">
    <div class="layui-layout layui-layout-admin">

        <!-- 头部 -->
        <div class="layui-header">
            <div class="layui-logo">
                <i class="layui-icon layui-icon-eye"></i> 视光管理系统
            </div>

            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                        <i class="layui-icon layui-icon-username"></i>
                        <span id="currentUserName">管理员</span>
                        <span id="roleBadge" class="role-badge"></span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" id="profileBtn">个人信息</a></dd>
                        <dd><a href="javascript:;" id="logoutBtn">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 侧边栏 -->
        <div class="layui-side">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" id="navMenu" lay-filter="navMenu">
                    <!-- 菜单将通过 JavaScript 动态生成 -->
                </ul>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="layui-body">
            <iframe id="contentFrame" name="contentFrame" src="/vision/dashboard" frameborder="0"
                style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script src="/vision/static/layui/layui.js"></script>
    <script>
        layui.use(['element', 'jquery', 'layer'], function () {
            var element = layui.element;
            var $ = layui.$;
            var layer = layui.layer;

            var currentUser = null;

            // 获取用户信息
            $.ajax({
                url: '/vision/api/user/info',
                type: 'GET',
                success: function (res) {
                    if (res.code === 0 && res.data) {
                        currentUser = res.data;
                        $('#currentUserName').text(currentUser.realName || currentUser.username);

                        // 显示角色标签
                        var roleNames = {
                            'ADMIN': '管理员',
                            'OPTOMETRIST': '验光师',
                            'DOCTOR': '医生',
                            'PROCESSOR': '加工师'
                        };
                        $('#roleBadge')
                            .text(roleNames[currentUser.role] || currentUser.role)
                            .addClass('role-' + currentUser.role);

                        // 根据角色生成菜单
                        generateMenus(currentUser.role);
                        element.render('nav');
                    } else {
                        window.location.href = '/vision/login';
                    }
                },
                error: function () {
                    window.location.href = '/vision/login';
                }
            });

            // 根据角色生成菜单
            function generateMenus(role) {
                var $nav = $('#navMenu');
                $nav.empty();

                // 所有角色都有工作台
                addMenuItem('工作台', '/vision/dashboard', 'layui-icon-home');

                if (role === 'ADMIN') {
                    addSubMenu('患者管理', 'layui-icon-user', [
                        { title: '患者列表', url: '/vision/patient' },
                        { title: '新增患者', url: '/vision/patient/add' }
                    ]);
                    addSubMenu('验光管理', 'layui-icon-survey', [
                        { title: '验光记录', url: '/vision/optometry' }
                    ]);
                    addSubMenu('处方管理', 'layui-icon-form', [
                        { title: '处方列表', url: '/vision/prescription' }
                    ]);
                    addSubMenu('加工追溯', 'layui-icon-component', [
                        { title: '加工单管理', url: '/vision/processing' }
                    ]);
                    addSubMenu('随访管理', 'layui-icon-notice', [
                        { title: '随访计划', url: '/vision/followup' }
                    ]);
                    addSubMenu('数据分析', 'layui-icon-chart', [
                        { title: '统计分析', url: '/vision/analysis' }
                    ]);
                    addSubMenu('系统管理', 'layui-icon-set', [
                        { title: '用户管理', url: '/vision/system/user' },
                        { title: '操作日志', url: '/vision/system/log' }
                    ]);
                }

                if (role === 'OPTOMETRIST') {
                    addSubMenu('患者管理', 'layui-icon-user', [
                        { title: '患者列表', url: '/vision/patient' },
                        { title: '新增患者', url: '/vision/patient/add' }
                    ]);
                    addSubMenu('验光管理', 'layui-icon-survey', [
                        { title: '验光记录', url: '/vision/optometry' }
                    ]);
                    addSubMenu('数据分析', 'layui-icon-chart', [
                        { title: '统计分析', url: '/vision/analysis' }
                    ]);
                }

                if (role === 'DOCTOR') {
                    addSubMenu('患者管理', 'layui-icon-user', [
                        { title: '患者列表', url: '/vision/patient' }
                    ]);
                    addSubMenu('验光管理', 'layui-icon-survey', [
                        { title: '验光记录', url: '/vision/optometry' }
                    ]);
                    addSubMenu('处方管理', 'layui-icon-form', [
                        { title: '处方列表', url: '/vision/prescription' }
                    ]);
                    addSubMenu('数据分析', 'layui-icon-chart', [
                        { title: '统计分析', url: '/vision/analysis' }
                    ]);
                }

                if (role === 'PROCESSOR') {
                    addSubMenu('加工追溯', 'layui-icon-component', [
                        { title: '加工单管理', url: '/vision/processing' }
                    ]);
                }

                element.render('nav');
            }

            function addMenuItem(title, url, icon) {
                var $nav = $('#navMenu');
                var $item = $('<li class="layui-nav-item"></li>');
                var $link = $('<a href="javascript:;" data-url="' + url + '"><i class="layui-icon ' + icon + '"></i> ' + title + '</a>');
                $item.append($link);
                $nav.append($item);
            }

            function addSubMenu(title, icon, items) {
                var $nav = $('#navMenu');
                var $item = $('<li class="layui-nav-item"></li>');
                var $link = $('<a href="javascript:;"><i class="layui-icon ' + icon + '"></i> ' + title + '</a>');
                var $dl = $('<dl class="layui-nav-child"></dl>');

                for (var i = 0; i < items.length; i++) {
                    var $dd = $('<dd><a href="javascript:;" data-url="' + items[i].url + '">' + items[i].title + '</a></dd>');
                    $dl.append($dd);
                }

                $item.append($link).append($dl);
                $nav.append($item);
            }

            // 绑定菜单点击事件
            $(document).on('click', '.layui-nav a[data-url]', function (e) {
                e.preventDefault();
                var url = $(this).data('url');
                if (url) {
                    $('#contentFrame').attr('src', url);
                }
            });

            // 个人信息按钮
            $('#profileBtn').on('click', function (e) {
                e.preventDefault();
                if (currentUser) {
                    var roleNames = {
                        'ADMIN': '管理员',
                        'OPTOMETRIST': '验光师',
                        'DOCTOR': '医生',
                        'PROCESSOR': '加工师'
                    };
                    var content = '<div style="padding:20px; line-height:2.5;">' +
                        '<p><strong>用户名：</strong>' + (currentUser.username || '-') + '</p>' +
                        '<p><strong>真实姓名：</strong>' + (currentUser.realName || '-') + '</p>' +
                        '<p><strong>角色：</strong>' + (roleNames[currentUser.role] || currentUser.role) + '</p>' +
                        '</div>';

                    layer.open({
                        type: 1,
                        title: '个人信息',
                        area: ['400px', '250px'],
                        content: content
                    });
                } else {
                    $.ajax({
                        url: '/vision/api/user/info',
                        type: 'GET',
                        success: function (res) {
                            if (res.code === 0 && res.data) {
                                currentUser = res.data;
                                $('#profileBtn').click();
                            }
                        }
                    });
                }
            });

            // 退出登录
            $('#logoutBtn').on('click', function (e) {
                e.preventDefault();
                layer.confirm('确定要退出系统吗？', {
                    icon: 3,
                    title: '提示'
                }, function (index) {
                    $.ajax({
                        url: '/vision/api/user/logout',
                        type: 'POST',
                        success: function () {
                            layer.close(index);
                            window.location.href = '/vision/login';
                        },
                        error: function () {
                            layer.close(index);
                            window.location.href = '/vision/login';
                        }
                    });
                });
            });
        });
    </script>
</body>

</html>

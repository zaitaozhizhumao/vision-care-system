<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>登录 - 视光管理系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            background: linear-gradient(135deg, #009688 0%, #4DB6AC 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-box {
            width: 400px;
            background: #fff;
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            text-align: center;
            font-size: 28px;
            color: #009688;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-btn {
            background: #009688;
            width: 100%;
            height: 45px;
            font-size: 16px;
        }

        .login-btn:hover {
            background: #00796B;
        }

        .demo-tip {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }

        .layui-input-wrap {
            position: relative;
        }

        .layui-input-prefix {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            z-index: 10;
        }

        .layui-input-prefix+input {
            padding-left: 35px !important;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="login-title">视光管理系统</div>
        <div class="login-subtitle">Vision Care System</div>

        <form class="layui-form" lay-filter="loginForm">
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-username"></i>
                    </div>
                    <input type="text" name="username" lay-verify="required" placeholder="用户名" class="layui-input"
                        autocomplete="off" value="admin">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-password"></i>
                    </div>
                    <input type="password" name="password" lay-verify="required" placeholder="密码" class="layui-input"
                        autocomplete="off" value="123456">
                </div>
            </div>
            <div class="layui-form-item">
                <button class="layui-btn login-btn" lay-submit lay-filter="login">登 录</button>
            </div>
        </form>

        <div class="demo-tip">
            <strong>测试账号：</strong><br>
            管理员：admin / 123456<br>
            验光师：optometrist1 / 123456<br>
            加工师：processor1 / 123456<br>
            医生：doctor1 / 123456
        </div>
    </div>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['form', 'layer', 'jquery'], function () {
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.$;

            // 表单提交
            form.on('submit(login)', function (data) {
                // 显示加载中
                var loadIndex = layer.load(1);

                $.ajax({
                    url: '/vision/api/user/login',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data.field),
                    success: function (res) {
                        layer.close(loadIndex);
                        if (res.code === 0) {
                            layer.msg('登录成功', { icon: 1 });
                            setTimeout(function () {
                                window.location.href = '/vision/';
                            }, 1000);
                        } else {
                            layer.msg(res.msg || '登录失败', { icon: 2 });
                        }
                    },
                    error: function (xhr, status, error) {
                        layer.close(loadIndex);
                        console.error('登录请求失败:', status, error);
                        layer.msg('网络错误，请重试', { icon: 2 });
                    }
                });

                return false; // 阻止表单默认提交
            });

            // 回车登录
            $(document).on('keydown', function (e) {
                if (e.keyCode === 13) {
                    $('.login-btn').click();
                }
            });
        });
        /*]]>*/
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>验光检查</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #fff;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #009688;
            color: #333;
        }

        .eye-group {
            display: flex;
        }

        .eye-item {
            flex: 1;
            padding: 0 15px;
        }

        .eye-label {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #009688;
            font-size: 14px;
        }

        .form-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <form class="layui-form" lay-filter="optometryForm">
        <!-- 隐藏字段 -->
        <input type="hidden" name="optometristId" id="optometristId">

        <!-- 患者选择 -->
        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="layui-form-item">
                    <label class="layui-form-label">患者</label>
                    <div class="layui-input-block">
                        <select id="patientSelect" name="patientId" lay-verify="required" lay-search>
                            <option value="">请选择患者</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 检查时间 -->
        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">检查时间</label>
                    <div class="layui-input-block">
                        <input type="text" name="checkDate" id="checkDate" lay-verify="required" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <!-- 裸眼视力 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-eye"></i> 裸眼视力
        </div>
        <div class="eye-group">
            <div class="eye-item">
                <div class="eye-label">右眼 (OD)</div>
                <input type="text" name="visionOdNaked" placeholder="裸眼视力" class="layui-input">
            </div>
            <div class="eye-item">
                <div class="eye-label">左眼 (OS)</div>
                <input type="text" name="visionOsNaked" placeholder="裸眼视力" class="layui-input">
            </div>
            <div class="eye-item">
                <div class="eye-label">双眼 (OU)</div>
                <input type="text" name="visionOuNaked" placeholder="裸眼视力" class="layui-input">
            </div>
        </div>

        <!-- 电脑验光 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-computer"></i> 电脑验光
        </div>
        <div class="eye-group">
            <div class="eye-item">
                <div class="eye-label">右眼 (OD)</div>
                <div class="layui-row layui-col-space5">
                    <div class="layui-col-md4">
                        <input type="text" name="sphereOd" placeholder="球镜(S)" class="layui-input">
                    </div>
                    <div class="layui-col-md4">
                        <input type="text" name="cylinderOd" placeholder="柱镜(C)" class="layui-input">
                    </div>
                    <div class="layui-col-md4">
                        <input type="text" name="axisOd" placeholder="轴位(A)" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="eye-item">
                <div class="eye-label">左眼 (OS)</div>
                <div class="layui-row layui-col-space5">
                    <div class="layui-col-md4">
                        <input type="text" name="sphereOs" placeholder="球镜(S)" class="layui-input">
                    </div>
                    <div class="layui-col-md4">
                        <input type="text" name="cylinderOs" placeholder="柱镜(C)" class="layui-input">
                    </div>
                    <div class="layui-col-md4">
                        <input type="text" name="axisOs" placeholder="轴位(A)" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <!-- 矫正视力 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-ok-circle"></i> 矫正视力
        </div>
        <div class="eye-group">
            <div class="eye-item">
                <input type="text" name="visionOdCorrected" placeholder="右眼矫正视力" class="layui-input">
            </div>
            <div class="eye-item">
                <input type="text" name="visionOsCorrected" placeholder="左眼矫正视力" class="layui-input">
            </div>
            <div class="eye-item">
                <input type="text" name="visionOuCorrected" placeholder="双眼矫正视力" class="layui-input">
            </div>
        </div>

        <!-- 其他参数 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-set"></i> 其他参数
        </div>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">瞳距(PD)</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="pdDistance" placeholder="mm" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">瞳高(PH)</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="phDistance" placeholder="mm" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">右眼眼压</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="eyePressureOd" placeholder="mmHg" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">左眼眼压</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="eyePressureOs" placeholder="mmHg" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <!-- 下加光 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-addition"></i> 下加光(ADD)
        </div>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">右眼下加光</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="addOd" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:80px;">左眼下加光</label>
                    <div class="layui-input-block" style="margin-left:110px;">
                        <input type="text" name="addOs" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <!-- 备注 -->
        <div class="section-title">
            <i class="layui-icon layui-icon-note"></i> 备注
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="margin-left:0;">
                <textarea name="remark" placeholder="请输入备注信息" class="layui-textarea"></textarea>
            </div>
        </div>

        <div class="form-footer">
            <button class="layui-btn" lay-submit lay-filter="saveBtn" style="width: 120px;">
                <i class="layui-icon layui-icon-ok"></i> 保存草稿
            </button>
            <button type="button" class="layui-btn layui-btn-primary" onclick="closeLayer()"
                style="width: 120px; margin-left: 20px;">
                <i class="layui-icon layui-icon-close"></i> 取消
            </button>
        </div>
    </form>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['form', 'laydate', 'jquery'], function () {
            var form = layui.form;
            var laydate = layui.laydate;
            var $ = layui.$;

            console.log('验光检查页面加载完成');

            // 【关键】初始化日期选择器，格式必须包含秒
            laydate.render({
                elem: '#checkDate',
                type: 'datetime',
                format: 'yyyy-MM-dd HH:mm:ss',
                value: new Date()
            });

            // 获取当前登录用户作为验光师
            $.ajax({
                url: '/vision/api/user/info',
                type: 'GET',
                success: function (res) {
                    if (res.code === 0 && res.data) {
                        $('#optometristId').val(res.data.userId);
                        console.log('当前验光师ID:', res.data.userId);
                    } else {
                        $('#optometristId').val('2');
                        console.log('使用默认验光师ID: 2');
                    }
                },
                error: function () {
                    $('#optometristId').val('2');
                }
            });

            // 加载患者列表
            console.log('开始加载患者列表...');
            $.ajax({
                url: '/vision/api/patient/page',
                type: 'GET',
                data: { page: 1, limit: 100 },
                success: function (res) {
                    console.log('患者列表返回:', res);
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择患者</option>';
                        for (var i = 0; i < res.data.length; i++) {
                            var p = res.data[i];
                            html += '<option value="' + p.id + '">' + p.name + ' (' + (p.phone || '无电话') + ')</option>';
                        }
                        $('#patientSelect').html(html);
                        form.render('select');
                        console.log('患者列表加载完成，共 ' + res.data.length + ' 条');

                        // 如果有传入 patientId，自动选中
                        var patientId = getQueryString('patientId');
                        if (patientId) {
                            $('#patientSelect').val(patientId);
                            form.render('select');
                            console.log('自动选中患者ID:', patientId);
                        }
                    } else {
                        console.error('加载患者列表失败:', res);
                        layer.msg('加载患者列表失败');
                    }
                },
                error: function (xhr, status, error) {
                    console.error('加载患者列表失败:', error);
                    layer.msg('加载患者列表失败，请刷新重试');
                }
            });

            // 表单提交
            form.on('submit(saveBtn)', function (data) {
                var formData = data.field;

                // 验证必填字段
                if (!formData.patientId) {
                    layer.msg('请选择患者', { icon: 2 });
                    return false;
                }

                if (!formData.checkDate) {
                    layer.msg('请选择检查时间', { icon: 2 });
                    return false;
                }

                // 【关键】确保日期格式包含秒
                var checkDate = formData.checkDate;
                if (checkDate && checkDate.length === 16) {
                    checkDate = checkDate + ':00';
                }

                // 构造提交数据，空字符串转为null
                var submitData = {
                    patientId: parseInt(formData.patientId),
                    optometristId: parseInt($('#optometristId').val()) || 2,
                    checkDate: checkDate,
                    visionOdNaked: formData.visionOdNaked || null,
                    visionOsNaked: formData.visionOsNaked || null,
                    visionOuNaked: formData.visionOuNaked || null,
                    sphereOd: formData.sphereOd || null,
                    sphereOs: formData.sphereOs || null,
                    cylinderOd: formData.cylinderOd || null,
                    cylinderOs: formData.cylinderOs || null,
                    axisOd: formData.axisOd ? parseInt(formData.axisOd) : null,
                    axisOs: formData.axisOs ? parseInt(formData.axisOs) : null,
                    addOd: formData.addOd || null,
                    addOs: formData.addOs || null,
                    visionOdCorrected: formData.visionOdCorrected || null,
                    visionOsCorrected: formData.visionOsCorrected || null,
                    visionOuCorrected: formData.visionOuCorrected || null,
                    pdDistance: formData.pdDistance || null,
                    phDistance: formData.phDistance || null,
                    eyePressureOd: formData.eyePressureOd || null,
                    eyePressureOs: formData.eyePressureOs || null,
                    remark: formData.remark || null
                };

                console.log('提交验光数据:', JSON.stringify(submitData));

                // 显示加载中
                var loadIndex = layer.load(1);

                $.ajax({
                    url: '/vision/api/optometry/save',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(submitData),
                    success: function (res) {
                        layer.close(loadIndex);
                        console.log('保存结果:', res);
                        if (res.code === 0) {
                            parent.layer.msg('保存成功', { icon: 1 });
                            setTimeout(function () {
                                closeLayer();
                            }, 1000);
                        } else {
                            layer.msg(res.msg || '保存失败', { icon: 2 });
                        }
                    },
                    error: function (xhr, status, error) {
                        layer.close(loadIndex);
                        console.error('保存失败:', status, error);
                        console.error('响应内容:', xhr.responseText);
                        layer.msg('保存失败，请重试', { icon: 2 });
                    }
                });

                return false;
            });
        });

        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function closeLayer() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }
        /*]]>*/
    </script>
</body>

</html>

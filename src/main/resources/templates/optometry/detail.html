<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>验光详情</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #fff;
        }

        .detail-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .detail-item {
            margin-bottom: 15px;
            display: flex;
        }

        .detail-label {
            width: 120px;
            color: #666;
        }

        .detail-value {
            flex: 1;
            color: #333;
        }
    </style>
</head>

<body>

    <div id="detailContent"></div>

    <script src="/vision/static/layui/layui.js"></script>
    <script>
        layui.use(['jquery'], function () {
            var $ = layui.$;
            var id = getQueryString('id');

            if (id) {
                $.get('/vision/api/optometry/' + id, function (res) {
                    if (res.code === 0) {
                        var d = res.data;
                        var html = '<div class="detail-title">验光详情</div>';
                        html += '<div class="detail-item"><span class="detail-label">患者：</span><span class="detail-value">' + (d.patientName || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">检查时间：</span><span class="detail-value">' + (d.checkDate || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">右眼球镜：</span><span class="detail-value">' + (d.sphereOd || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">左眼球镜：</span><span class="detail-value">' + (d.sphereOs || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">右眼柱镜：</span><span class="detail-value">' + (d.cylinderOd || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">左眼柱镜：</span><span class="detail-value">' + (d.cylinderOs || '-') + '</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">瞳距：</span><span class="detail-value">' + (d.pdDistance || '-') + ' mm</span></div>';
                        html += '<div class="detail-item"><span class="detail-label">验光师：</span><span class="detail-value">' + (d.optometristName || '-') + '</span></div>';
                        $('#detailContent').html(html);
                    }
                });
            }
        });

        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }
    </script>
</body>

</html>

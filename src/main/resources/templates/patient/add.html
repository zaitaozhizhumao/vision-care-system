<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>患者信息</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #fff;
        }

        .form-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .required:after {
            content: ' *';
            color: red;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form class="layui-form" lay-filter="patientForm">
            <!-- 隐藏字段：患者ID，编辑时必须带上 -->
            <input type="hidden" name="id" id="patientId">

            <div class="layui-form-item">
                <label class="layui-form-label required">姓名</label>
                <div class="layui-input-block">
                    <input type="text" name="name" lay-verify="required" placeholder="请输入患者姓名" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required">性别</label>
                <div class="layui-input-block">
                    <input type="radio" name="gender" value="MALE" title="男" checked>
                    <input type="radio" name="gender" value="FEMALE" title="女">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">出生日期</label>
                <div class="layui-input-block">
                    <input type="text" name="birthDate" id="birthDate" placeholder="yyyy-MM-dd" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required">联系电话</label>
                <div class="layui-input-block">
                    <input type="text" name="phone" lay-verify="required|phone" placeholder="请输入手机号码"
                        class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">身份证号</label>
                <div class="layui-input-block">
                    <input type="text" name="idCard" placeholder="请输入身份证号" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">地址</label>
                <div class="layui-input-block">
                    <input type="text" name="address" placeholder="请输入详细地址" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">病史</label>
                <div class="layui-input-block">
                    <textarea name="medicalHistory" placeholder="请输入既往病史" class="layui-textarea"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">家族史</label>
                <div class="layui-input-block">
                    <textarea name="familyHistory" placeholder="请输入家族眼病史" class="layui-textarea"></textarea>
                </div>
            </div>

            <div class="layui-form-item" style="text-align: center;">
                <button class="layui-btn" lay-submit lay-filter="saveBtn" style="width: 120px;">
                    <i class="layui-icon layui-icon-ok"></i> 保存
                </button>
                <button type="button" class="layui-btn layui-btn-primary" onclick="closeLayer()"
                    style="width: 120px; margin-left: 20px;">
                    <i class="layui-icon layui-icon-close"></i> 取消
                </button>
            </div>
        </form>
    </div>

    <script src="/vision/static/layui/layui.js"></script>
    <script>
        layui.use(['form', 'laydate', 'jquery'], function () {
            var form = layui.form;
            var laydate = layui.laydate;
            var $ = layui.$;

            // 初始化日期选择器
            laydate.render({
                elem: '#birthDate',
                max: 0
            });

            // 自定义验证规则
            form.verify({
                phone: function (value) {
                    if (value && !/^1[3-9]\d{9}$/.test(value)) {
                        return '请输入正确的手机号码';
                    }
                }
            });

            // 获取URL参数中的患者ID
            var patientId = getQueryString('id');
            console.log('编辑患者ID:', patientId);

            // 如果是编辑模式，加载患者数据
            if (patientId) {
                $('#patientId').val(patientId);

                $.ajax({
                    url: '/vision/api/patient/' + patientId,
                    type: 'GET',
                    success: function (res) {
                        if (res.code === 0) {
                            var patient = res.data;
                            console.log('加载患者数据:', patient);

                            // 填充表单
                            form.val('patientForm', {
                                id: patient.id,
                                name: patient.name,
                                gender: patient.gender,
                                birthDate: patient.birthDate,
                                phone: patient.phone,
                                idCard: patient.idCard,
                                address: patient.address,
                                medicalHistory: patient.medicalHistory,
                                familyHistory: patient.familyHistory
                            });
                        } else {
                            layer.msg('加载患者信息失败: ' + res.msg);
                        }
                    },
                    error: function () {
                        layer.msg('网络错误，请重试');
                    }
                });
            }

            // 表单提交
            form.on('submit(saveBtn)', function (data) {
                var formData = data.field;
                console.log('提交数据:', formData);

                // 确保ID字段存在（如果是编辑）
                if (patientId) {
                    formData.id = patientId;
                }

                $.ajax({
                    url: '/vision/api/patient/save',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(formData),
                    success: function (res) {
                        if (res.code === 0) {
                            var msg = patientId ? '更新成功' : '添加成功';
                            parent.layer.msg(msg, { icon: 1 });
                            setTimeout(function () {
                                closeLayer();
                            }, 1000);
                        } else {
                            layer.msg(res.msg || '保存失败', { icon: 2 });
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('保存失败:', error);
                        layer.msg('保存失败，请重试', { icon: 2 });
                    }
                });

                return false;
            });
        });

        // 获取URL参数
        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        // 关闭弹窗
        function closeLayer() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }
    </script>

    <style>
        .required:after {
            content: ' *';
            color: red;
        }
    </style>
</body>

</html>

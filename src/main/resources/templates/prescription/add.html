<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>开具处方</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #fff;
        }

        .form-container {
            max-width: 750px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #009688;
            color: #333;
        }

        .form-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form class="layui-form" lay-filter="prescriptionForm">
            <!-- 隐藏字段 -->
            <input type="hidden" name="optometryId" id="optometryId">
            <input type="hidden" name="patientId" id="patientIdValue">
            <input type="hidden" name="doctorId" id="doctorId">

            <!-- 关联信息 -->
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md12">
                    <div class="layui-form-item">
                        <label class="layui-form-label">患者</label>
                        <div class="layui-input-block">
                            <select id="patientSelect" name="patientId" lay-verify="required" lay-search>
                                <option value="">请选择患者</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">验光记录</label>
                        <div class="layui-input-block">
                            <select id="optometrySelect" name="optometryId" lay-search>
                                <option value="">请选择验光记录</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">医生</label>
                        <div class="layui-input-block">
                            <select id="doctorSelect" name="doctorId">
                                <option value="">请选择医生</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 镜架信息 -->
            <div class="section-title">
                <i class="layui-icon layui-icon-star"></i> 镜架信息
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">镜架类型</label>
                        <div class="layui-input-block">
                            <select name="frameType">
                                <option value="">请选择</option>
                                <option value="全框">全框</option>
                                <option value="半框">半框</option>
                                <option value="无框">无框</option>
                                <option value="钛架">钛架</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">镜架品牌</label>
                        <div class="layui-input-block">
                            <input type="text" name="frameBrand" placeholder="如：RayBan" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">镜架型号</label>
                        <div class="layui-input-block">
                            <input type="text" name="frameModel" placeholder="如：RB2140" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 镜片信息 -->
            <div class="section-title">
                <i class="layui-icon layui-icon-component"></i> 镜片信息
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">镜片类型</label>
                        <div class="layui-input-block">
                            <select name="lensType">
                                <option value="">请选择</option>
                                <option value="单光">单光</option>
                                <option value="渐进多焦点">渐进多焦点</option>
                                <option value="抗疲劳">抗疲劳</option>
                                <option value="防蓝光">防蓝光</option>
                                <option value="变色片">变色片</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">镜片材质</label>
                        <div class="layui-input-block">
                            <select name="lensMaterial">
                                <option value="">请选择</option>
                                <option value="树脂">树脂</option>
                                <option value="PC片">PC片</option>
                                <option value="玻璃">玻璃</option>
                                <option value="水晶">水晶</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">折射率</label>
                        <div class="layui-input-block">
                            <select name="lensIndex">
                                <option value="">请选择</option>
                                <option value="1.56">1.56</option>
                                <option value="1.60">1.60</option>
                                <option value="1.67">1.67</option>
                                <option value="1.74">1.74</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 处方度数 -->
            <div class="section-title">
                <i class="layui-icon layui-icon-eye"></i> 处方度数
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">右眼球镜(S)</label>
                        <div class="layui-input-block">
                            <input type="text" name="sphereOd" placeholder="如：-2.50" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">左眼球镜(S)</label>
                        <div class="layui-input-block">
                            <input type="text" name="sphereOs" placeholder="如：-2.25" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">右眼柱镜(C)</label>
                        <div class="layui-input-block">
                            <input type="text" name="cylinderOd" placeholder="如：-0.50" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">左眼柱镜(C)</label>
                        <div class="layui-input-block">
                            <input type="text" name="cylinderOs" placeholder="如：-0.50" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">右眼轴位(A)</label>
                        <div class="layui-input-block">
                            <input type="text" name="axisOd" placeholder="如：180" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">左眼轴位(A)</label>
                        <div class="layui-input-block">
                            <input type="text" name="axisOs" placeholder="如：175" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">瞳距(PD)</label>
                        <div class="layui-input-block">
                            <input type="text" name="pdDistance" placeholder="mm" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">瞳高(PH)</label>
                        <div class="layui-input-block">
                            <input type="text" name="phDistance" placeholder="mm" class="layui-input" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 费用信息 -->
            <div class="section-title">
                <i class="layui-icon layui-icon-rmb"></i> 费用信息
            </div>
            <div class="layui-row layui-col-space15">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">总价(元)</label>
                        <div class="layui-input-block">
                            <input type="number" name="price" placeholder="请输入总价" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">用途类型</label>
                        <div class="layui-input-block">
                            <select name="usageType">
                                <option value="DISTANCE">远用</option>
                                <option value="READING">阅读</option>
                                <option value="PROGRESSIVE">渐进多焦点</option>
                                <option value="COMPUTER">电脑专用</option>
                                <option value="DRIVING">驾驶专用</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button class="layui-btn" lay-submit lay-filter="saveBtn" style="width: 120px;">
                    <i class="layui-icon layui-icon-ok"></i> 保存处方
                </button>
                <button type="button" class="layui-btn layui-btn-primary" onclick="closeLayer()"
                    style="width: 120px; margin-left: 20px;">
                    <i class="layui-icon layui-icon-close"></i> 取消
                </button>
            </div>
        </form>
    </div>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['form', 'jquery', 'layer'], function () {
            var form = layui.form;
            var $ = layui.$;
            var layer = layui.layer;

            console.log('处方页面加载完成');

            // 获取当前登录医生ID
            $.ajax({
                url: '/vision/api/user/info',
                type: 'GET',
                success: function (res) {
                    if (res.code === 0 && res.data) {
                        $('#doctorId').val(res.data.userId);
                        console.log('当前医生ID:', res.data.userId);
                    }
                },
                error: function () {
                    console.log('获取医生信息失败');
                }
            });

            // 加载患者列表
            console.log('开始加载患者列表...');
            $.ajax({
                url: '/vision/api/patient/page',
                type: 'GET',
                data: { page: 1, limit: 100 },
                success: function (res) {
                    console.log('患者列表返回:', res);
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择患者</option>';
                        for (var i = 0; i < res.data.length; i++) {
                            var p = res.data[i];
                            html += '<option value="' + p.id + '">' + p.name + ' (' + (p.phone || '无电话') + ')</option>';
                        }
                        $('#patientSelect').html(html);
                        form.render('select');
                        console.log('患者列表加载完成，共 ' + res.data.length + ' 条');

                        // 如果有传入optometryId，自动加载验光数据
                        var optometryId = getQueryString('optometryId');
                        if (optometryId) {
                            $('#optometryId').val(optometryId);
                            loadOptometryData(optometryId);
                        }
                    } else {
                        console.error('加载患者列表失败:', res);
                    }
                },
                error: function (xhr, status, error) {
                    console.error('加载患者列表失败:', error);
                    layer.msg('加载患者列表失败，请刷新重试');
                }
            });

            // 加载医生列表
            console.log('开始加载医生列表...');
            $.ajax({
                url: '/vision/api/user/role/DOCTOR',
                type: 'GET',
                success: function (res) {
                    console.log('医生列表返回:', res);
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择医生</option>';
                        for (var i = 0; i < res.data.length; i++) {
                            var d = res.data[i];
                            html += '<option value="' + d.id + '">' + d.realName + '</option>';
                        }
                        $('#doctorSelect').html(html);
                        form.render('select');
                        console.log('医生列表加载完成');
                    }
                },
                error: function () {
                    console.log('加载医生列表失败，使用默认医生');
                    // 设置默认医生
                    $('#doctorSelect').html('<option value="4">王医生</option>');
                    $('#doctorSelect').val('4');
                    form.render('select');
                }
            });

            // 监听患者选择变化，加载该患者的验光记录
            form.on('select(patientSelect)', function (data) {
                var patientId = data.value;
                $('#patientIdValue').val(patientId);

                if (patientId) {
                    console.log('选择患者ID:', patientId);
                    // 加载该患者的验光记录
                    $.ajax({
                        url: '/vision/api/optometry/patient/' + patientId,
                        type: 'GET',
                        success: function (res) {
                            console.log('验光记录返回:', res);
                            if (res.code === 0 && res.data) {
                                var html = '<option value="">请选择验光记录</option>';
                                for (var i = 0; i < res.data.length; i++) {
                                    var o = res.data[i];
                                    if (o.status === 'CONFIRMED') {
                                        html += '<option value="' + o.id + '">' +
                                            (o.checkDate ? o.checkDate.substring(0, 16) : '') +
                                            ' | OD:' + (o.sphereOd || '-') +
                                            ' OS:' + (o.sphereOs || '-') +
                                            '</option>';
                                    }
                                }
                                $('#optometrySelect').html(html);
                                form.render('select');
                                console.log('验光记录加载完成');
                            }
                        },
                        error: function () {
                            console.log('加载验光记录失败');
                        }
                    });
                }
            });

            // 监听验光记录选择变化，自动填充度数
            form.on('select(optometrySelect)', function (data) {
                var optometryId = data.value;
                if (optometryId) {
                    loadOptometryData(optometryId);
                }
            });

            // 加载验光数据并填充表单
            function loadOptometryData(optometryId) {
                console.log('加载验光数据:', optometryId);
                $.ajax({
                    url: '/vision/api/optometry/' + optometryId,
                    type: 'GET',
                    success: function (res) {
                        console.log('验光数据返回:', res);
                        if (res.code === 0 && res.data) {
                            var o = res.data;
                            // 填充患者
                            if (o.patientId) {
                                $('#patientSelect').val(o.patientId);
                                $('#patientIdValue').val(o.patientId);
                            }
                            // 填充度数
                            $('input[name="sphereOd"]').val(o.sphereOd || '');
                            $('input[name="sphereOs"]').val(o.sphereOs || '');
                            $('input[name="cylinderOd"]').val(o.cylinderOd || '');
                            $('input[name="cylinderOs"]').val(o.cylinderOs || '');
                            $('input[name="axisOd"]').val(o.axisOd || '');
                            $('input[name="axisOs"]').val(o.axisOs || '');
                            $('input[name="pdDistance"]').val(o.pdDistance || '');
                            $('input[name="phDistance"]').val(o.phDistance || '');
                            form.render('select');
                            console.log('度数填充完成');
                        }
                    },
                    error: function () {
                        console.log('加载验光数据失败');
                    }
                });
            }

            // 表单提交
            form.on('submit(saveBtn)', function (data) {
                var formData = data.field;
                console.log('提交处方数据:', formData);

                // 验证必填字段
                if (!formData.patientId) {
                    layer.msg('请选择患者', { icon: 2 });
                    return false;
                }

                // 构造提交数据
                var submitData = {
                    patientId: formData.patientId,
                    optometryId: formData.optometryId || null,
                    doctorId: $('#doctorId').val() || formData.doctorId || '4',
                    frameType: formData.frameType || null,
                    frameBrand: formData.frameBrand || null,
                    frameModel: formData.frameModel || null,
                    lensType: formData.lensType || null,
                    lensMaterial: formData.lensMaterial || null,
                    lensIndex: formData.lensIndex || null,
                    sphereOd: formData.sphereOd || null,
                    sphereOs: formData.sphereOs || null,
                    cylinderOd: formData.cylinderOd || null,
                    cylinderOs: formData.cylinderOs || null,
                    axisOd: formData.axisOd || null,
                    axisOs: formData.axisOs || null,
                    pdDistance: formData.pdDistance || null,
                    phDistance: formData.phDistance || null,
                    usageType: formData.usageType || 'DISTANCE',
                    price: formData.price || null
                };

                console.log('最终提交数据:', JSON.stringify(submitData));

                $.ajax({
                    url: '/vision/api/prescription/save',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(submitData),
                    success: function (res) {
                        console.log('保存结果:', res);
                        if (res.code === 0) {
                            parent.layer.msg('处方保存成功', { icon: 1 });
                            setTimeout(function () {
                                closeLayer();
                            }, 1000);
                        } else {
                            layer.msg(res.msg || '保存失败', { icon: 2 });
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('保存失败:', status, error);
                        console.error('响应内容:', xhr.responseText);
                        layer.msg('保存失败: ' + error, { icon: 2 });
                    }
                });

                return false;
            });

            // 渲染表单
            form.render();
        });

        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function closeLayer() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }
        /*]]>*/
    </script>
</body>

</html>

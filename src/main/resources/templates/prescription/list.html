<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>处方管理</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 15px;
            background-color: #f5f5f5;
        }

        .search-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .table-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="search-box">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md3">
                <input type="text" id="keyword" placeholder="患者姓名/处方编号" class="layui-input">
            </div>
            <div class="layui-col-md2">
                <select id="statusSelect">
                    <option value="">全部状态</option>
                    <option value="DRAFT">草稿</option>
                    <option value="PENDING">待处理</option>
                    <option value="PROCESSING">加工中</option>
                    <option value="COMPLETED">已完成</option>
                    <option value="DELIVERED">已交付</option>
                    <option value="CANCELLED">已作废</option>
                </select>
            </div>
            <div class="layui-col-md2">
                <button class="layui-btn layui-btn-primary" id="searchBtn">
                    <i class="layui-icon layui-icon-search"></i> 搜索
                </button>
                <button class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
            </div>
            <div class="layui-col-md5" style="text-align: right;">
                <button class="layui-btn" id="addBtn">
                    <i class="layui-icon layui-icon-add-1"></i> 开具处方
                </button>
            </div>
        </div>
    </div>

    <div class="table-box">
        <table id="prescriptionTable" lay-filter="prescriptionTable"></table>
    </div>

    <!-- 操作栏模板 -->
    <script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="view">查看</a>
        {{# if(d.status === 'DRAFT'){ }}
            <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="confirm">确认</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="cancel">作废</a>
        {{# } }}
        {{# if(d.status === 'PENDING'){ }}
            <a class="layui-btn layui-btn-xs" lay-event="process" style="background-color:#5FB878;">创建加工单</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="cancel">作废</a>
        {{# } }}
    </div>
</script>

    <!-- 状态模板 -->
    <script type="text/html" id="statusTpl">
    {{# var statusMap = {
        'DRAFT': '<span class="layui-badge layui-bg-gray">草稿</span>',
        'PENDING': '<span class="layui-badge layui-bg-blue">待处理</span>',
        'PROCESSING': '<span class="layui-badge layui-bg-orange">加工中</span>',
        'COMPLETED': '<span class="layui-badge layui-bg-green">已完成</span>',
        'DELIVERED': '<span class="layui-badge">已交付</span>',
        'CANCELLED': '<span class="layui-badge layui-bg-red">已作废</span>'
    }; }}
    {{# return statusMap[d.status] || d.status; }}
</script>

    <script src="/vision/static/layui/layui.js"></script>
    <script th:inline="none">
        /*<![CDATA[*/
        layui.use(['table', 'form', 'layer', 'jquery'], function () {
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var $ = layui.$;

            console.log('处方管理页面加载完成');
            form.render('select');

            var tableIns = table.render({
                elem: '#prescriptionTable',
                url: '/vision/api/prescription/page',
                page: true,
                limit: 15,
                cols: [[
                    { type: 'numbers', title: '序号', width: 60 },
                    { field: 'prescriptionNo', title: '处方编号', width: 140 },
                    { field: 'patientName', title: '患者', width: 100 },
                    { field: 'doctorName', title: '医生', width: 100 },
                    { field: 'frameType', title: '镜架类型', width: 100 },
                    { field: 'lensType', title: '镜片类型', width: 100 },
                    { field: 'price', title: '金额', width: 80 },
                    { field: 'status', title: '状态', width: 80, templet: '#statusTpl' },
                    { field: 'createTime', title: '开具时间', width: 160 },
                    { title: '操作', toolbar: '#toolbar', width: 260, fixed: 'right' }
                ]],
                parseData: function (res) {
                    return { code: res.code, msg: res.msg, count: res.count, data: res.data };
                }
            });

            // 搜索
            $('#searchBtn').on('click', function () {
                tableIns.reload({
                    where: { keyword: $('#keyword').val(), status: $('#statusSelect').val() },
                    page: { curr: 1 }
                });
            });

            // 重置
            $('#resetBtn').on('click', function () {
                $('#keyword').val('');
                $('#statusSelect').val('');
                form.render('select');
                tableIns.reload({ where: { keyword: '', status: '' }, page: { curr: 1 } });
            });

            // 开具处方
            $('#addBtn').on('click', function () {
                layer.open({
                    type: 2,
                    title: '开具处方',
                    content: '/vision/prescription/add',
                    area: ['900px', '600px'],
                    shadeClose: false,
                    end: function () { tableIns.reload(); }
                });
            });

            // 回车搜索
            $('#keyword').on('keypress', function (e) {
                if (e.keyCode === 13) $('#searchBtn').click();
            });

            // 监听工具条事件
            table.on('tool(prescriptionTable)', function (obj) {
                var data = obj.data;
                console.log('操作事件:', obj.event, data);

                if (obj.event === 'view') {
                    // 查看详情
                    layer.open({
                        type: 2,
                        title: '处方详情 - ' + data.prescriptionNo,
                        content: '/vision/prescription/detail?id=' + data.id,
                        area: ['800px', '550px']
                    });
                } else if (obj.event === 'edit') {
                    // 编辑处方（仅草稿状态）
                    editPrescription(data.id);
                } else if (obj.event === 'confirm') {
                    // 确认处方
                    layer.confirm('确认处方后将自动生成随访计划，确定吗？', {
                        icon: 3,
                        title: '确认处方'
                    }, function (index) {
                        $.ajax({
                            url: '/vision/api/prescription/confirm/' + data.id,
                            type: 'PUT',
                            success: function (res) {
                                if (res.code === 0) {
                                    layer.msg('确认成功，随访计划已生成', { icon: 1 });
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '操作失败', { icon: 2 });
                                }
                            },
                            error: function () {
                                layer.msg('网络错误，请重试', { icon: 2 });
                            }
                        });
                        layer.close(index);
                    });
                } else if (obj.event === 'cancel') {
                    // 作废处方
                    layer.confirm('确定作废处方 ' + data.prescriptionNo + ' 吗？作废后不可恢复！', {
                        icon: 3,
                        title: '作废处方'
                    }, function (index) {
                        $.ajax({
                            url: '/vision/api/prescription/cancel/' + data.id,
                            type: 'PUT',
                            success: function (res) {
                                if (res.code === 0) {
                                    layer.msg('已作废', { icon: 1 });
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '操作失败', { icon: 2 });
                                }
                            },
                            error: function () {
                                layer.msg('网络错误，请重试', { icon: 2 });
                            }
                        });
                        layer.close(index);
                    });
                } else if (obj.event === 'process') {
                    // 创建加工单
                    layer.confirm('确定创建加工单吗？', function (index) {
                        $.ajax({
                            url: '/vision/api/processing/create/' + data.id,
                            type: 'POST',
                            success: function (res) {
                                if (res.code === 0) {
                                    layer.msg('加工单创建成功', { icon: 1 });
                                    tableIns.reload();
                                } else {
                                    layer.msg(res.msg || '操作失败', { icon: 2 });
                                }
                            },
                            error: function () {
                                layer.msg('网络错误，请重试', { icon: 2 });
                            }
                        });
                        layer.close(index);
                    });
                }
            });

            // 编辑处方函数
            function editPrescription(id) {
                layer.open({
                    type: 2,
                    title: '编辑处方',
                    content: '/vision/prescription/edit?id=' + id,
                    area: ['900px', '600px'],
                    shadeClose: false,
                    end: function () { tableIns.reload(); }
                });
            }
        });
        /*]]>*/
    </script>
</body>

</html>

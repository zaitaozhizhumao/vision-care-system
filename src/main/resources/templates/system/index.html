<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>系统管理</title>
    <link rel="stylesheet" href="/vision/static/layui/css/layui.css">
    <style>
        body {
            padding: 30px;
            background-color: #f5f5f5;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .card-icon {
            font-size: 48px;
            color: #009688;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
        }

        .card-desc {
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="layui-row layui-col-space20">
        <div class="layui-col-md4">
            <div class="card" onclick="parent.document.getElementById('contentFrame').src='/vision/system/user'">
                <div class="card-icon"><i class="layui-icon layui-icon-user"></i></div>
                <div class="card-title">用户管理</div>
                <div class="card-desc">管理系统用户账号</div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="card" onclick="parent.document.getElementById('contentFrame').src='/vision/system/log'">
                <div class="card-icon"><i class="layui-icon layui-icon-file"></i></div>
                <div class="card-title">操作日志</div>
                <div class="card-desc">查看系统操作记录</div>
            </div>
        </div>
    </div>

</body>

</html>
